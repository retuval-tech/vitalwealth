<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Dashboard — VitalWealth</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--bg2:#111827;--bg3:#1a2234;--teal:#2dd4bf;--teal-d:rgba(45,212,191,.1);--teal-m:rgba(45,212,191,.2);--emerald:#34d399;--violet:#a78bfa;--vi-d:rgba(167,139,250,.1);--rose:#fb7185;--ro-d:rgba(251,113,133,.1);--amber:#fbbf24;--am-d:rgba(251,191,36,.1);--sky:#38bdf8;--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#475569;--brd:rgba(255,255,255,.06);--brd2:rgba(255,255,255,.1);--f:'Sora',sans-serif;--f2:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--f2);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:1060px;margin:0 auto;padding:0 28px}
.header{padding:20px 0;border-bottom:1px solid var(--brd)}.h-inner{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt)}.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--teal),var(--emerald));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--f);font-weight:800;font-size:16px;color:var(--bg)}.logo-text{font-family:var(--f);font-weight:700;font-size:16px}
.nav-links{display:flex;gap:20px;align-items:center}.nav-links a{color:var(--txt2);text-decoration:none;font-size:13px;font-weight:500}.nav-links a:hover{color:var(--teal)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:20px;padding:40px;max-width:380px;width:100%;text-align:center}
.login-box h2{font-family:var(--f);font-size:22px;font-weight:700;margin-bottom:6px}.login-box p{color:var(--txt2);font-size:13px;margin-bottom:24px}
.form-input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--brd);border-radius:10px;color:var(--txt);font-size:14px;font-family:var(--f2);outline:none;margin-bottom:12px}.form-input:focus{border-color:var(--teal)}
.form-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--emerald));font-family:var(--f);font-weight:600;font-size:14px;color:var(--bg);cursor:pointer}
.dash{display:none;padding:32px 0 80px}
.stat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:28px}
.stat{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:18px}
.stat-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f);font-weight:600;margin-bottom:4px}
.stat-val{font-size:24px;font-weight:800;font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:18px}
.card-title{font-family:var(--f);font-size:14px;font-weight:700;margin-bottom:14px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:11px;color:var(--txt2);width:110px;flex-shrink:0;font-family:var(--f)}
.bar-track{flex:1;height:8px;border-radius:4px;background:var(--brd);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar-val{font-size:11px;color:var(--txt3);width:30px;text-align:right;font-family:var(--mono)}
.section-title{font-family:var(--f);font-size:18px;font-weight:700;margin:24px 0 14px}
.fb-card{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:20px;margin-bottom:12px}
.fb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fb-name{font-family:var(--f);font-size:14px;font-weight:700}.fb-email{font-size:11px;color:var(--txt3);font-family:var(--mono)}
.fb-date{font-size:10px;color:var(--txt3);font-family:var(--mono)}
.fb-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;font-family:var(--f)}
.tag-teal{color:var(--teal);background:var(--teal-d)}.tag-violet{color:var(--violet);background:var(--vi-d)}.tag-amber{color:var(--amber);background:var(--am-d)}.tag-rose{color:var(--rose);background:var(--ro-d)}.tag-emerald{color:var(--emerald);background:rgba(52,211,153,.1)}
.fb-text{font-size:13px;color:var(--txt2);line-height:1.6}
.fb-text strong{color:var(--txt);font-weight:600}
.fb-score{font-family:var(--mono);font-size:18px;font-weight:800;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.empty{text-align:center;padding:40px;color:var(--txt3);font-size:14px}
@media(max-width:768px){.stat-grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header"><div class="container"><div class="h-inner"><a href="/" class="logo"><div class="logo-mark">V</div><span class="logo-text">VitalWealth</span></a><div class="nav-links"><a href="/admin.html">Waitlist</a><a href="/analytics.html">Analytics</a><a href="/" id="logoutBtn" style="display:none" onclick="location.reload()">Logout</a></div></div></div></div>
<div class="container">
<div class="login-wrap" id="loginWrap">
<div class="login-box">
<h2>Feedback Dashboard</h2>
<p>View user feedback responses</p>
<input type="password" class="form-input" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
<button class="form-btn" onclick="doLogin()">Access Dashboard</button>
</div>
</div>
<div class="dash" id="dash">
<div class="stat-grid">
<div class="stat"><div class="stat-label">Responses</div><div class="stat-val" id="sTotal">—</div></div>
<div class="stat"><div class="stat-label">Avg Excitement</div><div class="stat-val" id="sExcitement" style="color:var(--teal)">—</div></div>
<div class="stat"><div class="stat-label">Would Pay</div><div class="stat-val" id="sPay" style="color:var(--emerald)">—</div></div>
<div class="stat"><div class="stat-label">Top Feature</div><div class="stat-val" id="sFeature" style="color:var(--violet);font-size:13px">—</div></div>
<div class="stat"><div class="stat-label">Top Role</div><div class="stat-val" id="sRole" style="color:var(--amber);font-size:13px">—</div></div>
</div>
<div class="grid2">
<div class="card"><div class="card-title">Most Interesting Feature</div><div id="featureBars"></div></div>
<div class="card"><div class="card-title">Would Pay?</div><div id="payBars"></div></div>
<div class="card"><div class="card-title">User Roles</div><div id="roleBars"></div></div>
<div class="card"><div class="card-title">Referral Source</div><div id="refBars"></div></div>
</div>
<div class="section-title">All Feedback</div>
<div id="feedbackList"><div class="empty">Loading...</div></div>
</div>
</div>
<script>
const SB='https://qmnfoqufgupixgugaiom.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbmZvcXVmZ3VwaXhndWdhaW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjc2MjcsImV4cCI6MjA4NjkwMzYyN30.gWJQeozdhUDRbKHTrJnsYywqsseyElnZjVV_o7tUERU';
const PW='vitalwealth2025';

function doLogin(){
  if(document.getElementById('pwInput').value===PW){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('dash').style.display='block';
    document.getElementById('logoutBtn').style.display='inline';
    loadData();
  }else{alert('Wrong password')}
}

function makeBars(el,data,color){
  const max=Math.max(...Object.values(data),1);
  const labels={'trading_bot':'Trading Bot','biometrics':'Biometrics','dopamine':'Dopamine Engine','kill_switch':'Kill Switch','dashboard':'Dashboard','all':'Whole Loop','yes_monthly':'Monthly','yes_yearly':'Annual','yes_lifetime':'Lifetime','free_only':'Free Only','need_more_info':'Need Info','crypto_trader':'Crypto Trader','biohacker':'Biohacker','investor':'Investor','developer':'Developer','curious':'Curious'};
  el.innerHTML=Object.entries(data).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,v])=>`<div class="bar-row"><div class="bar-label">${labels[k]||k}</div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:${color}"></div></div><div class="bar-val">${v}</div></div>`).join('');
}

function scoreColor(n){return n>=8?'var(--teal)':n>=5?'var(--amber)':'var(--rose)'}
function scoreBg(n){return n>=8?'var(--teal-d)':n>=5?'var(--am-d)':'var(--ro-d)'}

async function loadData(){
  try{
    const r=await fetch(SB+'/rest/v1/feedback?select=*&order=submitted_at.desc',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
    const data=await r.json();
    document.getElementById('sTotal').textContent=data.length;
    if(!data.length){document.getElementById('feedbackList').innerHTML='<div class="empty">No feedback yet. Share vitalwealth.app/feedback.html to start collecting!</div>';return}
    // Avg excitement
    const exScores=data.filter(d=>d.excitement).map(d=>d.excitement);
    const avgEx=exScores.length?(exScores.reduce((a,b)=>a+b,0)/exScores.length).toFixed(1):'—';
    document.getElementById('sExcitement').textContent=avgEx+'/10';
    // Would pay %
    const payYes=data.filter(d=>d.would_pay&&d.would_pay.startsWith('yes')).length;
    document.getElementById('sPay').textContent=data.length?Math.round(payYes/data.length*100)+'%':'—';
    // Top feature
    const fc={};data.forEach(d=>{if(d.most_interesting)fc[d.most_interesting]=(fc[d.most_interesting]||0)+1});
    const topF=Object.entries(fc).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('sFeature').textContent=topF?({'trading_bot':'Trading Bot','biometrics':'Biometrics','dopamine':'Dopamine','kill_switch':'Kill Switch','dashboard':'Dashboard','all':'Whole Loop'}[topF[0]]||topF[0]):'—';
    // Top role
    const rc={};data.forEach(d=>{if(d.role)rc[d.role]=(rc[d.role]||0)+1});
    const topR=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('sRole').textContent=topR?({'crypto_trader':'Crypto Trader','biohacker':'Biohacker','investor':'Investor','developer':'Developer','curious':'Curious'}[topR[0]]||topR[0]):'—';
    // Charts
    makeBars(document.getElementById('featureBars'),fc,'var(--violet)');
    const pc={};data.forEach(d=>{if(d.would_pay)pc[d.would_pay]=(pc[d.would_pay]||0)+1});
    makeBars(document.getElementById('payBars'),pc,'var(--emerald)');
    makeBars(document.getElementById('roleBars'),rc,'var(--amber)');
    const src={};data.forEach(d=>{const s=d.referral_source||'direct';src[s]=(src[s]||0)+1});
    makeBars(document.getElementById('refBars'),src,'var(--teal)');
    // Cards
    const labels={'trading_bot':'Trading Bot','biometrics':'Biometrics','dopamine':'Dopamine Engine','kill_switch':'Kill Switch','dashboard':'Dashboard','all':'Whole Loop','yes_monthly':'Monthly Sub','yes_yearly':'Annual Plan','yes_lifetime':'Lifetime','free_only':'Free Only','need_more_info':'Need Info','crypto_trader':'Crypto Trader','biohacker':'Biohacker','investor':'Investor','developer':'Developer','curious':'Curious'};
    document.getElementById('feedbackList').innerHTML=data.map(d=>{
      const date=d.submitted_at?new Date(d.submitted_at).toLocaleDateString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'';
      const ex=d.excitement||'—';
      let html=`<div class="fb-card"><div class="fb-head"><div><div class="fb-name">${d.name||'Anonymous'}</div><div class="fb-email">${d.email||'No email'}</div></div><div style="display:flex;align-items:center;gap:10px"><div class="fb-score" style="color:${scoreColor(ex)};background:${scoreBg(ex)}">${ex}</div><div class="fb-date">${date}</div></div></div><div class="fb-tags">`;
      if(d.role)html+=`<span class="tag tag-amber">${labels[d.role]||d.role}</span>`;
      if(d.most_interesting)html+=`<span class="tag tag-violet">${labels[d.most_interesting]||d.most_interesting}</span>`;
      if(d.would_pay)html+=`<span class="tag tag-emerald">${labels[d.would_pay]||d.would_pay}</span>`;
      if(d.referral_source&&d.referral_source!=='direct')html+=`<span class="tag tag-teal">via ${d.referral_source}</span>`;
      html+=`</div>`;
      if(d.concerns)html+=`<div class="fb-text"><strong>Concerns:</strong> ${d.concerns}</div>`;
      if(d.suggestions)html+=`<div class="fb-text" style="margin-top:6px"><strong>Suggestions:</strong> ${d.suggestions}</div>`;
      html+=`</div>`;
      return html;
    }).join('');
  }catch(e){document.getElementById('feedbackList').innerHTML='<div class="empty">Error loading feedback</div>'}
}
</script>
</body>
</html>
