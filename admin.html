<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — VitalWealth</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--bg2:#111827;--bg3:#1a2234;--teal:#2dd4bf;--teal-d:rgba(45,212,191,.1);--teal-m:rgba(45,212,191,.2);--emerald:#34d399;--violet:#a78bfa;--vi-d:rgba(167,139,250,.1);--rose:#fb7185;--ro-d:rgba(251,113,133,.1);--amber:#fbbf24;--am-d:rgba(251,191,36,.1);--txt:#f1f5f9;--txt2:#94a3b8;--txt3:#475569;--brd:rgba(255,255,255,.06);--brd2:rgba(255,255,255,.1);--f:'Sora',sans-serif;--f2:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:var(--f2);background:var(--bg);color:var(--txt);min-height:100vh;-webkit-font-smoothing:antialiased}
.container{max-width:960px;margin:0 auto;padding:0 28px}
.header{padding:20px 0;border-bottom:1px solid var(--brd)}.h-inner{display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--txt)}.logo-mark{width:34px;height:34px;background:linear-gradient(135deg,var(--teal),var(--emerald));border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--f);font-weight:800;font-size:16px;color:var(--bg)}.logo-text{font-family:var(--f);font-weight:700;font-size:16px}
.nav-links{display:flex;gap:20px;align-items:center}.nav-links a{color:var(--txt2);text-decoration:none;font-size:13px;font-weight:500;transition:color .2s}.nav-links a:hover{color:var(--teal)}
/* Login */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--brd2);border-radius:20px;padding:40px;max-width:380px;width:100%;text-align:center}
.login-box h2{font-family:var(--f);font-size:22px;font-weight:700;margin-bottom:6px}.login-box p{color:var(--txt2);font-size:13px;margin-bottom:24px}
.form-input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--brd);border-radius:10px;color:var(--txt);font-size:14px;font-family:var(--f2);outline:none;transition:border-color .2s;margin-bottom:12px}.form-input:focus{border-color:var(--teal)}
.form-btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--teal),var(--emerald));font-family:var(--f);font-weight:600;font-size:14px;color:var(--bg);cursor:pointer;transition:all .2s}.form-btn:hover{box-shadow:0 8px 24px rgba(45,212,191,.3)}
/* Dashboard */
.dash{display:none;padding:32px 0 80px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.stat{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;padding:18px}
.stat-label{font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f);font-weight:600;margin-bottom:4px}
.stat-val{font-size:28px;font-weight:800;font-family:var(--mono)}
.stat-chg{font-size:11px;margin-top:2px;font-family:var(--mono)}
.section-title{font-family:var(--f);font-size:18px;font-weight:700;margin:24px 0 14px}
.table-wrap{background:var(--bg2);border:1px solid var(--brd);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f);font-weight:600;border-bottom:1px solid var(--brd);background:var(--bg3)}
td{padding:12px 16px;font-size:13px;border-bottom:1px solid var(--brd)}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 10px;border-radius:100px;font-family:var(--f)}
.tag-teal{color:var(--teal);background:var(--teal-d)}
.empty{text-align:center;padding:40px;color:var(--txt3);font-size:14px}
.loading{text-align:center;padding:40px;color:var(--txt2);font-size:13px}
@media(max-width:768px){.stat-grid{grid-template-columns:1fr 1fr}.table-wrap{overflow-x:auto}table{min-width:600px}}
</style>
</head>
<body>
<div class="header"><div class="container"><div class="h-inner"><a href="/" class="logo"><div class="logo-mark">V</div><span class="logo-text">VitalWealth</span></a><div class="nav-links"><a href="/analytics.html">Analytics</a><a href="/" id="logoutBtn" style="display:none" onclick="location.reload()">Logout</a></div></div></div></div>
<div class="container">
<div class="login-wrap" id="loginWrap">
<div class="login-box">
<h2>Admin Dashboard</h2>
<p>Enter password to view waitlist</p>
<input type="password" class="form-input" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()">
<button class="form-btn" onclick="doLogin()">Access Dashboard</button>
</div>
</div>
<div class="dash" id="dash">
<div class="stat-grid">
<div class="stat"><div class="stat-label">Total Signups</div><div class="stat-val" id="sTotal">—</div></div>
<div class="stat"><div class="stat-label">Today</div><div class="stat-val" id="sToday" style="color:var(--teal)">—</div></div>
<div class="stat"><div class="stat-label">This Week</div><div class="stat-val" id="sWeek" style="color:var(--violet)">—</div></div>
<div class="stat"><div class="stat-label">Top Interest</div><div class="stat-val" id="sInterest" style="color:var(--amber);font-size:16px">—</div></div>
</div>
<div class="section-title">All Signups</div>
<div class="table-wrap"><table><thead><tr><th>Email</th><th>Name</th><th>Interests</th><th>Date</th></tr></thead><tbody id="tableBody"><tr><td colspan="4" class="loading">Loading...</td></tr></tbody></table></div>
</div>
</div>
<script>
const SB='https://qmnfoqufgupixgugaiom.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtbmZvcXVmZ3VwaXhndWdhaW9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzMjc2MjcsImV4cCI6MjA4NjkwMzYyN30.gWJQeozdhUDRbKHTrJnsYywqsseyElnZjVV_o7tUERU';
const PW='vitalwealth2025';

function doLogin(){
  if(document.getElementById('pwInput').value===PW){
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('dash').style.display='block';
    document.getElementById('logoutBtn').style.display='inline';
    loadData();
  }else{alert('Wrong password')}
}

async function loadData(){
  try{
    const r=await fetch(SB+'/rest/v1/waitlist?select=*&order=signed_up_at.desc',{headers:{'apikey':SK,'Authorization':'Bearer '+SK}});
    const data=await r.json();
    const now=new Date();const today=now.toISOString().split('T')[0];
    const weekAgo=new Date(now-7*864e5).toISOString();
    const todayCount=data.filter(d=>d.signed_up_at&&d.signed_up_at.startsWith(today)).length;
    const weekCount=data.filter(d=>d.signed_up_at&&d.signed_up_at>=weekAgo).length;
    document.getElementById('sTotal').textContent=data.length;
    document.getElementById('sToday').textContent=todayCount;
    document.getElementById('sWeek').textContent=weekCount;
    // Top interest
    const ic={};data.forEach(d=>{if(d.interests)d.interests.forEach(i=>{ic[i]=(ic[i]||0)+1})});
    const top=Object.entries(ic).sort((a,b)=>b[1]-a[1])[0];
    document.getElementById('sInterest').textContent=top?top[0]:'N/A';
    // Table
    const tb=document.getElementById('tableBody');
    if(!data.length){tb.innerHTML='<tr><td colspan="4" class="empty">No signups yet</td></tr>';return}
    tb.innerHTML=data.map(d=>{
      const date=d.signed_up_at?new Date(d.signed_up_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—';
      const interests=(d.interests||[]).map(i=>'<span class="tag tag-teal">'+i+'</span>').join(' ');
      return '<tr><td style="font-family:var(--mono);font-size:12px">'+d.email+'</td><td>'+(d.name||'—')+'</td><td>'+interests+'</td><td style="color:var(--txt3);font-size:12px;font-family:var(--mono)">'+date+'</td></tr>';
    }).join('');
  }catch(e){document.getElementById('tableBody').innerHTML='<tr><td colspan="4" class="empty">Error loading data</td></tr>'}
}
</script>
</body>
</html>
